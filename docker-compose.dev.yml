# Lab overlay. Not private. Use only on a machine you control.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  synapsenet:
    environment:
      SYNAPSENET_PRIVACY: "false"
      SYNAPSENET_TOR_REQUIRED: "false"
      SYNAPSENET_ALLOW_CLEARNET_FALLBACK: "true"
      SYNAPSENET_ALLOW_P2P_CLEARNET_FALLBACK: "true"
      SYNAPSENET_FORCE_CLEARNET_NAAN: "true"
      SYNAPSENET_NAAN_AUTO_SEARCH_MODE: "clearnet"
      SYNAPSENET_NAAN_DISABLE_DUPLICATE_GATES: "true"
      SYNAPSENET_POE_NOVELTY_BANDS: "0"
      SYNAPSENET_POE_ALLOW_SELF_BOOTSTRAP: "true"
      SYNAPSENET_ADDNODE: "host.docker.internal:18333"
