<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- SWAP ME: NGT coin, 16x16 pixel grid. Keep viewBox 0 0 16 16 so the spin/idle CSS still fits. -->
  <g fill="#f2f2f5">
    <rect x="6" y="0" width="4" height="1"/>
    <rect x="4" y="1" width="8" height="1"/>
    <rect x="3" y="2" width="10" height="1"/>
    <rect x="2" y="3" width="12" height="2"/>
    <rect x="1" y="5" width="14" height="6"/>
    <rect x="2" y="11" width="12" height="2"/>
    <rect x="3" y="13" width="10" height="1"/>
    <rect x="4" y="14" width="8" height="1"/>
    <rect x="6" y="15" width="4" height="1"/>
  </g>
  <!-- rim shading -->
  <g fill="#9a9aa0">
    <rect x="6" y="0" width="4" height="1"/>
    <rect x="4" y="1" width="2" height="1"/><rect x="10" y="1" width="2" height="1"/>
    <rect x="3" y="2" width="1" height="1"/><rect x="12" y="2" width="1" height="1"/>
    <rect x="2" y="3" width="1" height="2"/><rect x="13" y="3" width="1" height="2"/>
    <rect x="1" y="5" width="1" height="6"/><rect x="14" y="5" width="1" height="6"/>
    <rect x="2" y="11" width="1" height="2"/><rect x="13" y="11" width="1" height="2"/>
    <rect x="3" y="13" width="1" height="1"/><rect x="12" y="13" width="1" height="1"/>
    <rect x="4" y="14" width="2" height="1"/><rect x="10" y="14" width="2" height="1"/>
    <rect x="6" y="15" width="4" height="1"/>
  </g>
  <!-- N mark -->
  <g fill="#0a0a0a">
    <rect x="5" y="5" width="1" height="6"/>
    <rect x="10" y="5" width="1" height="6"/>
    <rect x="6" y="6" width="1" height="1"/>
    <rect x="7" y="7" width="1" height="1"/>
    <rect x="8" y="8" width="1" height="1"/>
    <rect x="9" y="9" width="1" height="1"/>
